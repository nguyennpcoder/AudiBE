server:
  port: ${PORT:8088}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript,text/javascript,image/svg+xml

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # Production (Supabase/Postgres). Set SPRING_DATASOURCE_URL/ USERNAME / PASSWORD on the host.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/audi}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 900000

  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: ${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        jdbc:
          time_zone: UTC
        type:
          preferred_enum_jdbc_type: VARCHAR
        format_sql: false

  # Enable multipart file upload
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

  # Redis configuration (overridable by env vars)
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  cache:
    type: ${SPRING_CACHE_TYPE:simple}

  # Email configuration - MOVED HERE from under logging
  mail:
    host: smtp.gmail.com
    port: 587
    username: nkockik@gmail.com
    password: kovejadsrwlrtvjj
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

